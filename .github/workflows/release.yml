name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci
      - run: npm run verify:version -- "$RELEASE_TAG"
      - run: npm run test:version
      - run: npm run check
      - run: npm run test:config
      - run: npm run build
      - run: npm run verify
      - name: Package static site
        run: |
          cp LICENSE dist/LICENSE
          (cd dist && zip -qr "../link-site-$RELEASE_TAG.zip" .)
      - uses: actions/upload-artifact@v7
        with:
          name: release-site
          path: link-site-*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-site
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" "link-site-$RELEASE_TAG.zip" --verify-tag --generate-notes --title "$RELEASE_TAG"
